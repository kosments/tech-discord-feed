settings:
  max_per_run: 2  # Max posts per channel per run (3 runs/day = up to 6 posts/day)

feeds:
  qiita:
    webhook_env: DISCORD_WEBHOOK_URL_QIITA
    sources:
      - url: https://qiita.com/tags/sre/feed
        name: Qiita SRE
      - url: https://qiita.com/tags/kubernetes/feed
        name: Qiita Kubernetes
      - url: https://qiita.com/tags/gcp/feed
        name: Qiita GCP

  zenn:
    webhook_env: DISCORD_WEBHOOK_URL_ZENN
    sources:
      - url: https://zenn.dev/topics/sre/feed
        name: Zenn SRE
      - url: https://zenn.dev/topics/kubernetes/feed
        name: Zenn Kubernetes
      - url: https://zenn.dev/topics/googlecloud/feed
        name: Zenn GoogleCloud

  googlecloud:
    webhook_env: DISCORD_WEBHOOK_URL_GOOGLECLOUD
    sources:
      - url: https://cloud.google.com/feeds/gcp-release-notes.xml
        name: GCP Release Notes
      - url: https://cloudblog.withgoogle.com/rss/
        name: Google Cloud Blog

  gke:
    webhook_env: DISCORD_WEBHOOK_URL_GKE
    sources:
      - url: https://cloud.google.com/feeds/container-engine-release-notes.xml
        name: GKE Release Notes

  k8s:
    webhook_env: DISCORD_WEBHOOK_URL_K8S
    sources:
      - url: https://kubernetes.io/feed.xml
        name: Kubernetes Blog
      - url: https://github.com/kubernetes/kubernetes/releases.atom
        name: Kubernetes Releases
      - url: https://github.com/kubernetes/enhancements/releases.atom
        name: Kubernetes Enhancements

  cncf:
    webhook_env: DISCORD_WEBHOOK_URL_CNCF
    sources:
      - url: https://www.cncf.io/feed/
        name: CNCF Blog
      - url: https://github.com/helm/helm/releases.atom
        name: Helm
      - url: https://github.com/argoproj/argo-cd/releases.atom
        name: ArgoCD
      - url: https://github.com/envoyproxy/envoy/releases.atom
        name: Envoy
      - url: https://github.com/istio/istio/releases.atom
        name: Istio
      - url: https://github.com/prometheus/prometheus/releases.atom
        name: Prometheus
      - url: https://github.com/open-telemetry/opentelemetry-collector/releases.atom
        name: OpenTelemetry Collector

  newrelic:
    webhook_env: DISCORD_WEBHOOK_URL_NEWRELIC
    sources:
      - url: https://newrelic.com/blog/rss.xml
        name: New Relic Blog
      - url: https://github.com/newrelic/newrelic-cli/releases.atom
        name: New Relic CLI

  hackernews:
    webhook_env: DISCORD_WEBHOOK_URL_HACKERNEWS
    keywords:
      include:
        - "SRE"
        - "infrastructure"
        - "Kubernetes"
        - "cloud"
        - "CDN"
        - "networking"
        - "observability"
        - "monitoring"
        - "reliability"
        - "DevOps"
        - "incident"
        - "platform engineering"
    sources:
      - url: https://hnrss.org/frontpage
        name: Hacker News

  bytebytego:
    webhook_env: DISCORD_WEBHOOK_URL_BYTEBYTEGO
    sources:
      - url: https://blog.bytebytego.com/feed
        name: ByteByteGo

  medium:
    webhook_env: DISCORD_WEBHOOK_URL_MEDIUM
    sources:
      - url: https://medium.com/feed/google-cloud
        name: Google Cloud Medium
      - url: https://netflixtechblog.com/feed
        name: Netflix TechBlog
      - url: https://engineering.linkedin.com/blog.rss.html
        name: LinkedIn Engineering

  apigeex:
    webhook_env: DISCORD_WEBHOOK_URL_APIGEEX
    sources:
      - url: https://cloud.google.com/feeds/apigee-release-notes.xml
        name: Apigee X Release Notes

  glb:
    webhook_env: DISCORD_WEBHOOK_URL_GLB
    sources:
      - url: https://cloud.google.com/feeds/cloud-load-balancing-release-notes.xml
        name: Cloud Load Balancing
      - url: https://cloud.google.com/feeds/cloud-armor-release-notes.xml
        name: Cloud Armor
      - url: https://cloud.google.com/feeds/cloud-cdn-release-notes.xml
        name: Cloud CDN

  akamai:
    webhook_env: DISCORD_WEBHOOK_URL_AKAMAI
    sources:
      - url: https://www.akamai.com/blog/rss
        name: Akamai Blog

  fastly:
    webhook_env: DISCORD_WEBHOOK_URL_FASTLY
    sources:
      - url: https://www.fastly.com/blog/feed
        name: Fastly Blog

  cloudflare:
    webhook_env: DISCORD_WEBHOOK_URL_CLOUDFLARE
    sources:
      - url: https://blog.cloudflare.com/rss/
        name: Cloudflare Blog

keywords:
  priority:
    - "Breaking Change"
    - "Security"
    - "CVE"
    - "Vulnerability"
    - "Critical"
    - "Incident"
    - "Outage"
